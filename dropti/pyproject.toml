[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dropit"
version = "0.1.0"
description = "drOPit - où déposer son ami pour qu'il rentre plus vite, sans trop de détour"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gurobi = ["gurobipy>=11"]
r5 = ["r5py>=1.0", "geopandas", "shapely"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
